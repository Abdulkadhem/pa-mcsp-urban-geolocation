[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-mcsp-urban-geolocation"
version = "0.2.0"
description = "Reproducible implementation and locked release manifest for PA-MCSP urban image geolocation."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]
pilot = [
  "huggingface-hub>=0.27",
  "pandas>=2.1",
  "pyarrow>=15",
  "pyproj>=3.7",
  "rasterio>=1.4",
  "safetensors>=0.5",
  "s2sphere>=0.2.5",
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.48,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
